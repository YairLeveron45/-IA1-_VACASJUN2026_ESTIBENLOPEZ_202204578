services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: smartinvoice_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

  api:
    build:
      context: ./backend
    container_name: smartinvoice_api
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        alembic upgrade head &&
        python -m app.scripts.seed_admin &&
        uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload-dir app
        --reload

  db:
    image: postgres:17-alpine
    container_name: smartinvoice_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartinvoice}
      POSTGRES_USER: ${POSTGRES_USER:-smartinvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-smartinvoice} -d ${POSTGRES_DB:-smartinvoice}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
