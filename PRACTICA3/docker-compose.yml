services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1
    container_name: smartinvoice_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

  api:
    build:
      context: ./backend
    container_name: smartinvoice_api
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        alembic upgrade head &&
        python -m app.scripts.seed_admin &&
        uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
    restart: always

  db:
    image: postgres:17-alpine
    container_name: smartinvoice_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartinvoice}
      POSTGRES_USER: ${POSTGRES_USER:-smartinvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-smartinvoice} -d ${POSTGRES_DB:-smartinvoice}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  postgres_data:
